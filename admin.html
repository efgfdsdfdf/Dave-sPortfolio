<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · manage projects</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
  <style>
    /* Admin-specific styles (complements style.css) */
    .admin-section {
      max-width: 900px;
      margin: 0 auto;
    }

    .password-prompt {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      max-width: 400px;
      margin: 3rem auto;
    }

    .admin-form {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .form-row {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-row label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--accent);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-row input,
    .form-row textarea,
    .form-row select {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-row input:focus,
    .form-row textarea:focus,
    .form-row select:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .project-item {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }

    .project-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .project-info h4 {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
      color: var(--text-primary);
    }

    .project-info span {
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 0.2rem 0.75rem;
      border-radius: 30px;
      border: 1px solid var(--border-light);
    }

    .project-actions {
      display: flex;
      gap: 0.5rem;
    }

    .project-actions button {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
    }

    .project-actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59,130,246,0.1);
    }

    .project-actions .delete-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
    }

    .cancel-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      transition: var(--transition);
    }

    .cancel-btn:hover {
      border-color: var(--text-secondary);
    }

    .save-btn {
      background: var(--accent);
      border: none;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      transition: var(--transition);
    }

    .save-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">Ezeilo David</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="index.html#contact" class="nav-link">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container admin-section">
    <h1 class="section-title">Project admin</h1>

    <!-- Password protection -->
    <div id="passwordWrapper" class="password-prompt">
      <i class="fas fa-lock" style="font-size: 2rem; color: var(--accent); margin-bottom: 1rem;"></i>
      <p style="margin-bottom: 1.5rem;">Enter admin password to continue</p>
      <input type="password" id="adminPass" placeholder="••••••••" style="width:100%; padding:0.75rem; background:var(--bg-secondary); border:1px solid var(--border-light); border-radius:30px; color:white; text-align:center;">
      <button id="unlockBtn" class="btn btn-primary" style="margin-top:1.5rem; width:100%;">Unlock</button>
    </div>

    <!-- Admin panel (hidden until unlocked) -->
    <div id="adminPanel" class="hidden">
      <!-- Add new project form -->
      <div class="admin-form">
        <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
          <i class="fas fa-plus-circle" style="color: var(--accent);"></i> Add new project
        </h3>
        <div class="form-row">
          <label>Title</label>
          <input type="text" id="title" placeholder="e.g. OmniStore API">
        </div>
        <div class="form-row">
          <label>Short description</label>
          <input type="text" id="desc" placeholder="Brief overview">
        </div>
        <div class="form-row">
          <label>Problem it solved</label>
          <textarea id="problem" rows="2" placeholder="What challenge did it address?"></textarea>
        </div>
        <div class="form-row">
          <label>Tech stack (comma separated)</label>
          <input type="text" id="tech" placeholder="Node.js, Express, PostgreSQL">
        </div>
        <div class="form-row">
          <label>Architecture explanation</label>
          <textarea id="arch" rows="2" placeholder="Key design decisions..."></textarea>
        </div>
        <div class="form-row">
          <label>Category</label>
          <select id="category">
            <option value="frontend">Frontend</option>
            <option value="backend">Backend</option>
            <option value="fullstack">Fullstack</option>
          </select>
        </div>
        <div class="form-row">
          <label>GitHub link</label>
          <input type="text" id="github" value="#" placeholder="https://github.com/...">
        </div>
        <div class="form-row">
          <label>Live demo link</label>
          <input type="text" id="demo" value="#" placeholder="https://...">
        </div>
        <button id="addProjectBtn" class="btn btn-primary">Add project</button>
        <span id="adminFormStatus" style="margin-left: 1rem; color: var(--accent);"></span>
      </div>

      <!-- Existing projects list -->
      <h3 style="margin: 2rem 0 1rem; display: flex; align-items: center; gap: 0.5rem;">
        <i class="fas fa-list" style="color: var(--accent);"></i> Existing projects
      </h3>
      <div id="projectList" class="project-list"></div>

      <button id="resetDefaultsBtn" class="btn btn-secondary" style="margin-top: 2rem;">
        <i class="fas fa-undo-alt"></i> Reset to default projects
      </button>
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
        <i class="fas fa-edit" style="color: var(--accent);"></i> Edit project
      </h3>
      <div class="form-row">
        <label>Title</label>
        <input type="text" id="edit-title">
      </div>
      <div class="form-row">
        <label>Short description</label>
        <input type="text" id="edit-desc">
      </div>
      <div class="form-row">
        <label>Problem it solved</label>
        <textarea id="edit-problem" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label>Tech stack (comma separated)</label>
        <input type="text" id="edit-tech">
      </div>
      <div class="form-row">
        <label>Architecture explanation</label>
        <textarea id="edit-arch" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label>Category</label>
        <select id="edit-category">
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
          <option value="fullstack">Fullstack</option>
        </select>
      </div>
      <div class="form-row">
        <label>GitHub link</label>
        <input type="text" id="edit-github">
      </div>
      <div class="form-row">
        <label>Live demo link</label>
        <input type="text" id="edit-demo">
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" id="cancelEdit">Cancel</button>
        <button class="save-btn" id="saveEdit">Update project</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-container">
      <p>© 2025 Ezeilo David Chisom · fullstack engineer</p>
      <div class="footer-links">
        <a href="https://github.com/efgfdsdfdf" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="projects.html" aria-label="Back to projects"><i class="fas fa-arrow-left"></i></a>
      </div>
    </div>
  </footer>

  <!-- Supabase client library (must come before script.js) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Your main script with admin logic -->
  <script src="script.js"></script>
</body>
</html>
