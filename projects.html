<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects · Ezeilo David Chisom</title>
  <meta name="description" content="Detailed portfolio of fullstack projects — backend, frontend, and fullstack solutions with architecture insights.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14' font-size='14' fill='%232b6f9b'>⌨️</text></svg>">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
  <style>
    /* Compact project card styles */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .project-card.compact {
      padding: 1.25rem;
    }

    .project-card.compact .project-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .project-card.compact .project-desc {
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .project-card.compact .project-tech {
      margin: 0.75rem 0;
      gap: 0.4rem;
    }

    .project-card.compact .project-tech span {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
    }

    .project-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .project-actions .btn-small {
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      border-radius: 30px;
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
    }

    .project-actions .btn-small:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59,130,246,0.05);
    }

    .project-actions .btn-small i {
      font-size: 0.8rem;
    }

    .filter-bar {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .page-title {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      background: linear-gradient(to right, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .modal-content h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .modal-content h3 {
      font-size: 1.2rem;
      margin: 1.5rem 0 0.5rem;
      color: var(--text-primary);
    }

    .modal-content p {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .modal-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
    }

    .modal-tech span {
      background: var(--bg-secondary);
      padding: 0.3rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }

    .modal-links {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .modal-links a {
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
    }

    .modal-links .btn-github {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
    }

    .modal-links .btn-github:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-links .btn-demo {
      background: var(--accent);
      color: white;
    }

    .modal-links .btn-demo:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-close:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">Ezeilo David</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="projects.html" class="nav-link active">Projects</a></li>
          <li><a href="index.html#contact" class="nav-link">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="projects-page section">
      <div class="container">
        <h1 class="page-title">All projects</h1>
        
        <!-- Filter bar -->
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="frontend">Frontend</button>
          <button class="filter-btn" data-filter="backend">Backend</button>
          <button class="filter-btn" data-filter="fullstack">Fullstack</button>
        </div>

        <!-- Projects grid populated by JavaScript -->
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <p>© 2025 Ezeilo David Chisom · fullstack engineer</p>
      <div class="footer-links">
        <a href="https://github.com/efgfdsdfdf" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="admin.html" class="admin-link" aria-label="Admin">⚙️</a>
      </div>
    </div>
  </footer>

  <!-- Project Detail Modal -->
  <div class="modal" id="projectModal">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      
      <h3>Problem</h3>
      <p id="modalProblem"></p>
      
      <h3>Architecture</h3>
      <p id="modalArchitecture"></p>
      
      <h3>Tech Stack</h3>
      <div class="modal-tech" id="modalTech"></div>
      
      <div class="modal-links">
        <a href="#" id="modalGithub" class="btn-github" target="_blank" rel="noopener"><i class="fab fa-github"></i> View Code</a>
        <a href="#" id="modalDemo" class="btn-demo" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> Live Demo</a>
      </div>
    </div>
  </div>

  <!-- Supabase client library -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Your main script (handles rendering and modal) -->
  <script src="script.js"></script>
</body>
</html>
